name: Build Betong Lab Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android project
        run: |
          mkdir -p buildsrc
          find . -name 'BetongLabMobileBuild-PhoneOnly.zip' -exec unzip -o {} -d buildsrc/outer \;
          find . -name 'BetongLabAndroid-Starter.zip' -exec unzip -o {} -d buildsrc/project \;
          PROJECT=$(find . -name settings.gradle.kts -print -quit | xargs dirname)
          if [ -z "$PROJECT" ]; then
            echo "Khong tim thay du an Android"
            find . -type f
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT" >> $GITHUB_ENV
          echo "Tim thay: $PROJECT"

      - name: Build APK and AAB
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetongLabAndroid-build
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
