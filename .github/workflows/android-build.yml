
name: Build BetongLab Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'BetongLabAndroid-TichHop-HTML-v1.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -o BetongLabAndroid-TichHop-HTML-v1.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.11.1
        run: |
          wget https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build APK and AAB
        run: |
          gradle -p BetongLabAndroid :app:assembleDebug :app:bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: BetongLabAndroid-build
          path: |
            BetongLabAndroid/app/build/outputs/apk/debug/*.apk
            BetongLabAndroid/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
