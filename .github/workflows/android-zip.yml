name: Build Android (từ zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giải nén gói
        run: unzip -o phong-thi-nghiem-andr*.zip

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install
      - run: npm run build:web

      - name: Tạo dự án Android
        run: |
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android

      - name: Đặt versionCode
        run: |
          f=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" $f
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" $f

      - name: Build APK debug
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
